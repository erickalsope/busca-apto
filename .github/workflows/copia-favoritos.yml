name: Copia diária dos favoritos

on:
  schedule:
    - cron: "17 9 * * *" # 06h17 em São Paulo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ler o Supabase e gravar backup/
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 scripts/copia_favoritos.py

      - name: Salvar no repositório se algo mudou
        run: |
          git config user.name "copia-favoritos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backup
          if git diff --cached --quiet; then
            echo "Nada mudou desde a última cópia."
            exit 0
          fi
          git commit -m "copia favoritos $(date -u +%F)"
          git pull --rebase
          git push
